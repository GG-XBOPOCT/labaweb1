<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оформление заказа — ИгроМир</title>
</head>
<body>
    <header>
        <h1>Оформление заказа</h1>
        <p>Заполните данные для доставки настольных игр.</p>
    </header>
    <nav>
        <a href="index.html">Главная</a> |
        <a href="catalog.html">Каталог</a> |
        <a href="detail.html">Игра «Колонизаторы»</a> |
        <a href="collection.html">Корзина</a> |
        <a href="checkout.html">Оформление заказа</a>
    </nav>
    <main>
        <section>
            <h2>Данные покупателя</h2>
            <form action="#" method="get">
                <input type="hidden" name="cart_id" value="CART-1201">
                <p>
                    <label for="person">Контактное лицо:</label>
                    <input type="text" id="person" name="person" required minlength="2" maxlength="60">
                </p>
                <p>
                    <label for="email">Электронная почта:</label>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="phone">Телефон:</label>
                    <input type="tel" id="phone" name="phone" required pattern="[+]?[0-9 ()-]{7,20}">
                </p>
                <p>
                    <label for="transport">Транспортная компания:</label>
                    <select id="transport" name="transport" required>
                        <option value="">Выберите компанию</option>
                        <option value="cdek">СДЭК</option>
                        <option value="pochta">Почта России</option>
                        <option value="boxberry">Boxberry</option>
                    </select>
                </p>
                <p>
                    <label for="address">Адрес доставки:</label><br>
                    <textarea id="address" name="address" rows="4" cols="40" required minlength="10"></textarea>
                </p>
                <p>
                    <label for="date">Желаемая дата доставки:</label>
                    <input type="date" id="date" name="date" required>
                </p>
                <p>
                    <label for="promo">Промокод (если есть):</label>
                    <input type="text" id="promo" name="promo" maxlength="20">
                </p>
                <p>
                    <input type="checkbox" id="agree" name="agree" value="yes" required>
                    <label for="agree">Я проверил(а) данные заказа и согласен(на) с условиями доставки.</label>
                </p>
                <p><button type="submit">Отправить заказ</button></p>
            </form>
            <p>Форма демонстрационная: отправка данных на сервер не настроена.</p>
        </section>
    </main>
    <footer>
        <p>Магазин «ИгроМир». Учебный проект.</p>
        <p>Контакт: igromir@example.com</p>
    </footer>
</body>
</html>
